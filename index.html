<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mario's Adventure Game</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <!-- Header -->
        <header>
            <div class="header-content">
                <img
                    src="pixell-river-logo.svg"
                    alt="Pixell River Logo"
                    class="logo"
                />
                <h1>Pixell River Employee Directory</h1>
            </div>
            <p class="greeting">Welcome to the staff and department overview</p>
        </header>

        <!-- Main content -->
        <main>
            <section id="employee-directory">
                <!-- Department + Employee lists will be injected here by script.js -->
            </section>
        </main>

        <!-- Footer -->

        <footer>
            <p>
                Copyright Pixell River Financial
                <span id="year"></span>.
            </p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
